<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173ea5"><meta name="description" content="Offline-first academic event and submission deadline manager."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Academic Desk</title></head>
<body><div id="app" class="app-shell"><aside class="sidebar"><a class="brand" href="#dashboard"><span>AD</span><strong>Academic Desk</strong></a><nav id="nav"></nav><div class="side-bottom"><span id="connection" class="connection">Checking connection</span><button id="themeToggle" class="text-button">Toggle theme</button></div></aside><main><header class="topbar"><button id="menuButton" class="mobile-menu" aria-label="Open navigation">☰</button><div><h1 id="pageTitle">Dashboard</h1><p id="syncText" class="muted">Local-first workspace</p></div><div class="top-actions"><input id="globalSearch" type="search" placeholder="Search events, journals, countries…"><button id="quickAdd" class="primary">+ Add event</button></div></header><section id="view" class="view" aria-live="polite"></section></main></div>
<dialog id="eventDialog"><form id="eventForm" method="dialog" class="modal"><div class="modal-head"><div><h2 id="eventDialogTitle">Add academic event</h2><p class="muted">Fields marked * are required.</p></div><button type="button" class="icon" data-close="eventDialog">×</button></div><input name="id" type="hidden"><div class="form-grid"><label class="span-2">Event title *<input name="title" required placeholder="e.g. Demo International Computing Conference"></label><label>Event type *<select name="type"><option>Conference</option><option>Workshop</option><option>Seminar</option><option>Symposium</option><option>Webinar</option><option>Journal Special Issue</option><option>Call for Papers</option><option>Other</option></select></label><label>Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><label>Organizer / institution<input name="organizer"></label><label>Conference or journal name<input name="publication"></label><label>Country<input name="country"></label><label>City<input name="city"></label><label>Mode<select name="mode"><option>Hybrid</option><option>Online</option><option>Offline</option></select></label><label>Scope<select name="scope"><option>International</option><option>National</option></select></label><label>Event start<input name="startDate" type="date"></label><label>Event end<input name="endDate" type="date"></label><label class="span-2">Official website<input name="website" type="url" placeholder="https://"></label><label>Registration URL<input name="registrationUrl" type="url" placeholder="https://"></label><label>CFP / submission URL<input name="cfpUrl" type="url" placeholder="https://"></label><label>Indexing<select name="indexing"><option>Not specified</option><option>Scopus</option><option>Web of Science</option><option>SCI</option><option>ESCI</option><option>UGC-CARE</option></select></label><label>Registration fee<input name="fee" placeholder="e.g. ₹4,000"></label><label class="span-2">Research areas / tags<input name="tags" placeholder="AI, education, accessibility"></label><label class="span-2">Notes<textarea name="notes" rows="3"></textarea></label></div><div class="deadline-editor"><div class="section-head"><div><h3>Important dates</h3><p class="muted">Add every submission, registration, and event deadline.</p></div><button type="button" id="addDeadline" class="secondary">+ Add date</button></div><div id="deadlineFields"></div></div><div class="modal-footer"><button type="button" class="secondary" data-close="eventDialog">Cancel</button><button class="primary" value="default">Save event</button></div></form></dialog>
<dialog id="detailDialog"><div id="detailContent" class="modal"></div></dialog><dialog id="importDialog"><div class="modal"><div class="modal-head"><div><h2>Import or restore</h2><p class="muted">Restore a JSON backup created by Academic Desk.</p></div><button type="button" class="icon" data-close="importDialog">×</button></div><input id="backupFile" type="file" accept="application/json"><p id="importMessage" class="muted"></p><div class="modal-footer"><button type="button" class="secondary" data-close="importDialog">Cancel</button><button id="restoreBackup" class="primary">Restore backup</button></div></div></dialog><script type="module" src="app.js"></script></body></html>
